[package]
name = "ps-rustcrypto"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
authors = ["RustCrypto Developers"]
license = "MIT"
description = "Pure RustCrypto provider for rustls: ChaCha20-Poly1305 with ECDSA and Ed25519, no AES or RSA"
repository = "https://github.com/pathscale/ps-rustcrypto"
readme = "README.md"
categories = ["cryptography", "no-std"]
keywords = ["rustls", "tls", "rustcrypto"]

[features]
default = ["std", "tls12", "zeroize"]
alloc = ["pki-types/alloc", "ed25519-dalek/alloc", "signature/alloc"]
std = ["alloc", "pki-types/std", "rustls/std"]
tls12 = ["rustls/tls12"]
logging = ["rustls/logging"]
zeroize = ["ed25519-dalek/zeroize", "x25519-dalek/zeroize"]

[dependencies]
chacha20poly1305 = { version = "^0.11", default-features = false }
digest = { version = "^0.11", default-features = false }
ed25519-dalek = { version = "^3", default-features = false, features = ["pkcs8"] }
getrandom = { version = "^0.4", default-features = false }
hmac = { version = "^0.13", default-features = false }
p256 = { version = "^0.14", default-features = false, features = ["alloc", "ecdsa", "ecdh", "pem", "pkcs8"] }
p384 = { version = "^0.14", default-features = false, features = ["alloc", "ecdsa", "ecdh", "pem", "pkcs8"] }
pkcs8 = { version = "^0.11", default-features = false, features = ["alloc"] }
pki-types = { package = "rustls-pki-types", version = "^1", default-features = false }
rustls = { version = "^0.23", default-features = false }
sec1 = { version = "^0.8", default-features = false, features = ["der"] }
sha2 = { version = "^0.11", default-features = false, features = ["oid"] }
signature = { version = "^3", default-features = false }
x25519-dalek = { version = "^3", default-features = false, features = ["static_secrets"] }

[dev-dependencies]
# Certificates generated in process; ring is a test-only key generator here.
rcgen = "^0.14"
# Public root bundles, used only as a source of RSA keys to refuse.
webpki-roots = "^1"
webpki-root-certs = "^1"
